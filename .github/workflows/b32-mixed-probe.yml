name: B32 mixed precision numerical and compute plan probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check coremltools==9.0 torch==2.8.0 numpy==1.26.4 Pillow==11.2.1 cryptography==50.0.2
      - name: Evaluate the pinned six images and export device plans
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PAYLOAD_KEY: ${{ secrets.B32_MIXED_PROBE_KEY }}
        run: |
          set -euo pipefail
          gh release download build-input --pattern b32-mixed-probe-20261124-v1.bin
          python runner-crypto.py decrypt b32-mixed-probe-20261124-v1.bin probe.zip
          unzip -q probe.zip -d probe
          (cd probe && shasum -a 256 -c SHA256SUMS)
          mkdir result
          cp probe/SHA256SUMS result/
          (sw_vers; uname -m; sysctl -n hw.model) > result/runner.txt
          status=0
          python probe/probe-b32-mixed.py --trace probe/vision.pt --fixtures probe/fixtures --reference probe/fixtures/reference.json --output native > result/probe.log 2>&1 || status=$?
          test ! -f native/report.json || cp native/report.json result/
          printf '%s\n' "$status" > result/status.txt
          (cd result && zip -q ../results.zip ./*)
          python runner-crypto.py encrypt results.zip result.bin
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-b32-mixed-probe
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2

