name: B32 native search scores and tail-width controls
on:
  push:
    branches: [codex/m0-qaclip]
    paths: ['.github/workflows/b32lut8.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2 coremltools==8.3.0 numpy==1.26.4 Pillow==11.2.1
      - name: Validate encrypted image candidate and compile iOS
        env:
          CI_PAYLOAD_KEY: ${{ secrets.CI_PAYLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir app result compiled
          gh release download build-input --pattern b32-lut8-validation-v1.bin
          gh release download build-input --pattern b32-lut8-validation-v2.bin
          python runner-crypto.py decrypt b32-lut8-validation-v1.bin candidate.zip
          python runner-crypto.py decrypt b32-lut8-validation-v2.bin controls.zip
          unzip -o -q candidate.zip -d app
          unzip -o -q controls.zip -d app
          gh release download build-input --pattern b32-lut8-validation-v10.bin
          python runner-crypto.py decrypt b32-lut8-validation-v10.bin taps.zip
          unzip -q taps.zip
          python restore-b32-delta.py
          cp candidate-source.txt result/
          gh release download build-input --pattern fg58-models-v1.bin
          python runner-crypto.py decrypt fg58-models-v1.bin baseline.zip
          unzip -q baseline.zip -d app
          set +e
          python check-native-tail.py app/build/model-validation/B32LUT8Validation app/controls/VisionFP16.mlpackage result/TailReport.json > result/TailBuild.log 2>&1
          tail_status=$?
          python b32-native-scores.py app/build/model-validation/B32LUT8Validation app/build/model-validation/SigLIP2B32INT8-40000 models/sdpa-lut8.mlpackage result/ScoreReport.json > result/ScoreBuild.log 2>&1
          score_status=$?
          set -e
          printf 'tail=%s\nscore=%s\n' "$tail_status" "$score_status" > result/status.txt
          (cd result && zip -q -0 ../results.zip ./*)
          python runner-crypto.py encrypt results.zip result.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-b32-lut8-result
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2
