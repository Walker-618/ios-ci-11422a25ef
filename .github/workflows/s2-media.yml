name: Isolated Build52 S2 media pipeline
on:
  push:
    branches: [codex/m0-qaclip]
    paths: ['.github/workflows/s2-media.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          brew install xcodegen
      - name: Build unsigned S2 device IPA
        env:
          CI_PAYLOAD_KEY: ${{ secrets.CI_PAYLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download build-input --pattern inputs-v2.bin
          gh release download build-input --pattern mobileclip-v2.bin
          python runner-crypto.py decrypt inputs-v2.bin inputs.zip
          python runner-crypto.py decrypt mobileclip-v2.bin overlay.zip
          gh release download build-input --pattern s2-media-v2.bin
          python runner-crypto.py decrypt s2-media-v2.bin patch.zip
          mkdir app result
          unzip -q inputs.zip -d app
          unzip -o -q overlay.zip -d app
          unzip -o -q patch.zip -d app
          set +e
          bash -euo pipefail <<'BUILD' > result/Build.log 2>&1
            cd app
            export PTS_BUILD_SOURCE="$(cat source-commit.txt)"
            path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
            test -n "$path"
            export DEVELOPER_DIR="$path/Contents/Developer"
            xcodebuild -version
            mkdir -p build/model-validation/TinyTranslationCoreML
            echo '8fb31f86c48d5dc26dce1d6c6d6255d3ed3ff81c4eaf958e889383cb89c19678  ci-inputs/Picbi-Build47-b32-tiny-coreml.zip' | shasum -a 256 -c
            unzip -q ci-inputs/Picbi-Build47-b32-tiny-coreml.zip -d build/model-validation/TinyTranslationCoreML
            python scripts/download-mobileclip-ci.py build/model-validation/MobileCLIPUpstream
            python scripts/prepare-mobileclip-preview.py build/model-validation/MobileCLIPPreview --source build/model-validation/MobileCLIPUpstream
            cp ci-inputs/mobileclip-fixtures/* build/model-validation/MobileCLIPPreview/
            bash scripts/build-ipa.sh --mobileclip-preview
          BUILD
          status=$?
          set -e
          for file in app/dist/Picbi-MobileCLIP-S2-unsigned.ipa app/dist/Picbi-MobileCLIP-S2-build.txt app/build/model-validation/MobileCLIPSimulatorTests.log; do
            if [[ -f "$file" ]]; then cp "$file" result/; fi
          done
          cp app/source-commit.txt result/
          printf '%s\n' "$status" > result/status.txt
          (cd result && zip -0 ../results.zip ./* >/dev/null)
          python runner-crypto.py encrypt results.zip result.bin
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-s2-media-result
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2
