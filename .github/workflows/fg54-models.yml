name: Isolated Build54 LUT8 model validation
on:
  push:
    branches: [codex/m0-qaclip]
    paths: ['.github/workflows/fg54-models.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native validation dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 coremltools==8.3.0 numpy==1.26.4 Pillow==11.2.1
      - name: Validate isolated encrypted models
        env:
          CI_PAYLOAD_KEY: ${{ secrets.CI_PAYLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download build-input --pattern fg54-models-input-v1.bin
          python runner-crypto.py decrypt fg54-models-input-v1.bin inputs.zip
          unzip -q inputs.zip
          gh release download build-input --pattern fg54-models-input-v3.bin
          python runner-crypto.py decrypt fg54-models-input-v3.bin refinement.zip
          unzip -o -q refinement.zip
          mkdir result
          set +e
          python validate.py --candidates candidates --output result/FGCLIP2ANE-Build54 --image-names gpu-grouped16-fp16 > result/Build.log 2>&1
          status=$?
          set -e
          cp source-commit.txt result/
          if [[ -f candidates/NativeValidation.json ]]; then cp candidates/NativeValidation.json result/; fi
          if [[ -d result/FGCLIP2ANE-Build54 ]]; then (cd result && zip -q -r -1 modelpair.zip FGCLIP2ANE-Build54); fi
          printf '%s\n' "$status" > result/status.txt
          (cd result && zip -0 -q ../results.zip ./* -x 'FGCLIP2ANE-Build54/*')
          python runner-crypto.py encrypt results.zip result.bin
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-fg54-model-result
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2
