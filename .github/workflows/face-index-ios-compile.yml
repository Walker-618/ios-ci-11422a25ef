name: Native iOS compilation of five-stage index
on:
  push:
    branches: [codex/m0-qaclip]
    paths: ['.github/workflows/face-index-ios-compile.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          brew install xcodegen
      - name: Compile device target without packaging
        env:
          CI_PAYLOAD_KEY: ${{ secrets.CI_PAYLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download build-input --pattern inputs-v2.bin
          gh release download build-input --pattern mobileclip-v2.bin
          gh release download build-input --pattern fg54-overlay-v4.bin
          gh release download build-input --pattern fg54-validated-model.bin
          gh release download build-input --pattern fg55-overlay-v1.bin
          gh release download build-input --pattern fg56-overlay-v2.bin
          gh release download build-input --pattern fg57-overlay-v3.bin
          python runner-crypto.py decrypt inputs-v2.bin inputs.zip
          python runner-crypto.py decrypt mobileclip-v2.bin overlay.zip
          python runner-crypto.py decrypt fg54-overlay-v4.bin patch.zip
          python runner-crypto.py decrypt fg54-validated-model.bin models.zip
          python runner-crypto.py decrypt fg55-overlay-v1.bin cleanup.zip
          python runner-crypto.py decrypt fg56-overlay-v2.bin current.zip
          python runner-crypto.py decrypt fg57-overlay-v3.bin fix.zip
          gh release download build-input --pattern fg58-overlay-v3.bin
          gh release download build-input --pattern fg58-models-v1.bin
          python runner-crypto.py decrypt fg58-overlay-v3.bin build58.zip
          python runner-crypto.py decrypt fg58-models-v1.bin models58.zip
          mkdir app result
          unzip -q inputs.zip -d app
          unzip -o -q overlay.zip -d app
          unzip -o -q patch.zip -d app
          unzip -q models.zip -d app
          unzip -o -q cleanup.zip -d app
          unzip -o -q current.zip -d app
          unzip -o -q fix.zip -d app
          unzip -o -q build58.zip -d app
          unzip -o -q models58.zip -d app
          gh release download build-input --pattern face-index-ios-compile-v3.bin
          python runner-crypto.py decrypt face-index-ios-compile-v3.bin face-review.zip
          unzip -o -q face-review.zip -d app
          python - <<'VERIFY'
          import hashlib, json
          from pathlib import Path
          root = Path('app')
          for name, digest in json.loads((root / 'face-index-ios-compile-files.json').read_text()).items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          VERIFY
          set +e
          bash -euo pipefail <<'BUILD' > result/Build.log 2>&1
            cd app
            xcodebuild -version
            bash scripts/prepare-b32-dependencies.sh
            xcodegen generate --spec project-b32.yml
            xcodebuild -project PhotoTextSearch.xcodeproj -scheme PhotoTextSearch -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device SWIFT_ACTIVE_COMPILATION_CONDITIONS=PREVIEW_UNLIMITED_INDEX CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
            xcrun lipo build/device/Build/Products/Release-iphoneos/PhotoTextSearch.app/PhotoTextSearch -verify_arch arm64
          BUILD
          status=$?
          set -e
          cp app/candidate-source.txt result/
          printf '%s\n' "$status" > result/status.txt
          (cd result && zip -0 ../results.zip ./* >/dev/null)
          python runner-crypto.py encrypt results.zip result.bin
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-face-index-ios-compile-result
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2
