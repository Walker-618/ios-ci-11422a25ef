name: Isolated Build67 Picbi Art Album styles iPhone test IPA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2 coremltools==9.0 numpy==1.26.4 Pillow==11.2.1
          brew install xcodegen
      - name: Build unsigned device IPA
        env:
          CI_PAYLOAD_KEY: ${{ secrets.CI_PAYLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download build-input --pattern inputs-v2.bin
          gh release download build-input --pattern mobileclip-v2.bin
          gh release download build-input --pattern fg54-overlay-v4.bin
          gh release download build-input --pattern fg54-validated-model.bin
          gh release download build-input --pattern fg55-overlay-v1.bin
          gh release download build-input --pattern fg56-overlay-v2.bin
          gh release download build-input --pattern fg57-overlay-v3.bin
          python runner-crypto.py decrypt inputs-v2.bin inputs.zip
          python runner-crypto.py decrypt mobileclip-v2.bin overlay.zip
          python runner-crypto.py decrypt fg54-overlay-v4.bin patch.zip
          python runner-crypto.py decrypt fg54-validated-model.bin models.zip
          python runner-crypto.py decrypt fg55-overlay-v1.bin cleanup.zip
          python runner-crypto.py decrypt fg56-overlay-v2.bin current.zip
          python runner-crypto.py decrypt fg57-overlay-v3.bin fix.zip
          gh release download build-input --pattern fg58-overlay-v3.bin
          python runner-crypto.py decrypt fg58-overlay-v3.bin build58.zip
          mkdir app result
          unzip -q inputs.zip -d app
          unzip -o -q overlay.zip -d app
          unzip -o -q patch.zip -d app
          unzip -q models.zip -d app
          unzip -o -q cleanup.zip -d app
          unzip -o -q current.zip -d app
          unzip -o -q fix.zip -d app
          unzip -o -q build58.zip -d app
          gh release download build-input --pattern fg60-overlay-v1.bin
          python runner-crypto.py decrypt fg60-overlay-v1.bin build60.zip
          unzip -o -q build60.zip -d app
          gh release download build-input --pattern fg64-overlay-v1.bin
          python runner-crypto.py decrypt fg64-overlay-v1.bin build64.zip
          unzip -o -q build64.zip -d app
          gh release download build-input --pattern fg65-overlay-v1.bin
          python runner-crypto.py decrypt fg65-overlay-v1.bin build65.zip
          unzip -o -q build65.zip -d app
          gh release download build-input --pattern fg67-overlay-v1.bin
          python runner-crypto.py decrypt fg67-overlay-v1.bin build67.zip
          unzip -o -q build67.zip -d app
          python - <<'VERIFY'
          import hashlib, json
          from pathlib import Path
          root = Path('app')
          review = json.loads((root / 'build67-source-patch.json').read_text())
          assert review['build'] == 67 and review['privateMediaIncluded'] is False
          assert hashlib.sha256((root / 'build67-source-patch.json').read_bytes()).hexdigest() == (root / 'source-digest.txt').read_text().strip()
          assert review['sourceCommit'] == (root / 'source-commit.txt').read_text().strip()
          for name, entry in review['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == entry['size'] and hashlib.sha256(data).hexdigest() == entry['sha256']
          VERIFY
          set +e
          bash -euo pipefail <<'BUILD' > result/Build.log 2>&1
            cd app
            export PTS_BUILD_SOURCE="$(cat source-commit.txt)"
            export PTS_BUILD_SOURCE_DIGEST="$(cat source-digest.txt)"
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version | grep -E '^27\.'
            export PTS_FGCLIP2_SINGLE_CANDIDATE=1
            export PTS_FGCLIP2_SINGLE_BUILD_NUMBER=67
            bash scripts/build-ipa.sh --fgclip2-quality
            python - <<'STYLECHECK'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import coremltools as ct
          import numpy as np
          path = Path("dist/Picbi-FGCLIP2-40K-Quality-unsigned.ipa")
          with ZipFile(path) as archive, TemporaryDirectory() as tmp:
              prefix = "Payload/PhotoTextSearch.app/ArtAlbumStyles/"
              for entry in archive.namelist():
                  if entry.startswith(prefix):
                      archive.extract(entry, tmp)
              for compiled in sorted((Path(tmp) / prefix).glob("*.mlmodelc")):
                  model = ct.models.CompiledMLModel(str(compiled), compute_units=ct.ComputeUnit.CPU_ONLY)
                  for h, w in [(160, 128), (288, 288)]:
                      tensor = np.linspace(0, 1, num=3*h*w, dtype=np.float32).reshape(1, 3, h, w)
                      result = model.predict({"image": tensor})["result"]
                      channels = 1 if compiled.stem == "ArtSketch" else 3
                      assert result.shape == (1, channels, h, w) and result.dtype == np.float32
                      assert np.isfinite(result).all()
                  print(compiled.stem, "Core ML CPU prediction passed")
          STYLECHECK
            xcrun assetutil --info build/Build/Products/Release-iphoneos/PhotoTextSearch.app/Assets.car > ../result/Assets.json
          BUILD
          status=$?
          set -e
          for file in app/dist/Picbi-FGCLIP2-40K-Quality-unsigned.ipa app/dist/Picbi-FGCLIP2-40K-Quality-build.txt; do
            if [[ -f "$file" ]]; then cp "$file" result/; fi
          done
          cp app/source-commit.txt app/source-digest.txt app/build67-source-patch.json result/
          printf '%s\n' "$status" > result/status.txt
          (cd result && zip -0 ../results.zip ./* >/dev/null)
          python runner-crypto.py encrypt results.zip result.bin
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-fg67-result
          path: result.bin
          if-no-files-found: warn
          compression-level: 0
          retention-days: 2
